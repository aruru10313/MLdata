plugins {
    id 'java'
    id 'net.neoforged.moddev' version '1.0.11'
}

group = 'com.aruru.mldata'
version = '1.0-SNAPSHOT'

neoForge {
    version = "21.1.75"
    runs {
        client { client() }
        server { server() }
    }
    mods {
        mldatacollector {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    // MySQL Connector & HikariCP Connection Pool bundled via jarJar
    jarJar(implementation('com.mysql:mysql-connector-j:8.4.0')) {
        version {
            strictly '[8.0, 9.0)'
            prefer '8.4.0'
        }
    }
    jarJar(implementation('com.zaxxer:HikariCP:5.1.0')) {
        version {
            strictly '[5.0, 6.0)'
            prefer '5.1.0'
        }
    }

    // JSON parsing
    implementation 'com.google.code.gson:gson:2.10.1'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
