# Database Storage Settings (Hybrid Mode)
database:
  # The current server implementation uses the MySQL-compatible collector.
  # Keep credentials in config/mldata.properties, never in source control.
  type: "mysql"
  
  # Reserved for the cloud collector implementation.
  supabase-url: ""
  supabase-key: ""


# Data Collection Settings
collection:
  # How often to write batch data to the database (in seconds)
  batch-interval-seconds: 60
  
  # Minimum time between movement records per player (in milliseconds)
  movement-throttle-ms: 3000

web:
  port: 8080
